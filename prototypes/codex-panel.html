<title>咕咕嘎嘎 · 图鉴面板原型</title>
<style>
:root {
  --ground:#edeef2; --panel:#ffffff; --ink:#191c22; --ink-2:#5f6573; --ink-3:#8990a0;
  --line:#dee0e8; --accent:#c98f10; --warn:#c2452a; --ok:#3f8f6a; --field:#f4f5f8; --desc:#2f6b45;
  --deskA:#dfe4f0; --deskB:#eef0f6;
  --shadow:0 1px 2px rgba(25,28,34,.06), 0 12px 32px -16px rgba(25,28,34,.32);
}
@media (prefers-color-scheme: dark) { :root {
  --ground:#131519; --panel:#1a1d24; --ink:#e9ebf1; --ink-2:#949bab; --ink-3:#7b8393;
  --line:#282c35; --accent:#f0b638; --warn:#e8735a; --ok:#63b892; --field:#22262f; --desc:#7ecfa2;
  --deskA:#20242e; --deskB:#171a21;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 14px 38px -18px rgba(0,0,0,.85); } }
:root[data-theme="dark"] {
  --ground:#131519; --panel:#1a1d24; --ink:#e9ebf1; --ink-2:#949bab; --ink-3:#7b8393;
  --line:#282c35; --accent:#f0b638; --warn:#e8735a; --ok:#63b892; --field:#22262f; --desc:#7ecfa2;
  --deskA:#20242e; --deskB:#171a21;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 14px 38px -18px rgba(0,0,0,.85); }
:root[data-theme="light"] {
  --ground:#edeef2; --panel:#ffffff; --ink:#191c22; --ink-2:#5f6573; --ink-3:#8990a0;
  --line:#dee0e8; --accent:#c98f10; --warn:#c2452a; --ok:#3f8f6a; --field:#f4f5f8; --desc:#2f6b45;
  --deskA:#dfe4f0; --deskB:#eef0f6;
  --shadow:0 1px 2px rgba(25,28,34,.06), 0 12px 32px -16px rgba(25,28,34,.32); }

* { box-sizing:border-box; }
body { margin:0; background:var(--ground); color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  line-height:1.6; -webkit-font-smoothing:antialiased; }
.wrap { max-width:1120px; margin:0 auto; padding:40px 24px 72px; }
header { display:flex; flex-wrap:wrap; align-items:baseline; gap:12px 16px; }
h1 { font-size:24px; font-weight:650; margin:0; }
.tagline { color:var(--ink-2); font-size:14px; margin:0; }
.lede { color:var(--ink-2); font-size:15px; max-width:74ch; margin:14px 0 20px; }
.lede b { color:var(--ink); font-weight:600; }
.lede code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13.5px;
  background:var(--field); padding:1px 6px; border-radius:5px; color:var(--ink); }

.bar { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin:0 0 14px; }
.barnote { font-size:12.5px; color:var(--ink-3); }
.btn { font:inherit; font-size:12.5px; line-height:1.4; color:var(--ink); background:var(--panel);
  border:1px solid var(--line); border-radius:8px; padding:5px 10px; margin:0; cursor:pointer; }
.btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
.btn.on { border-color:var(--accent); color:var(--accent);
  background:color-mix(in srgb,var(--accent) 10%,var(--panel)); }

.stage-outer { border:1px solid var(--line); border-radius:14px; padding:30px;
  background:linear-gradient(140deg,var(--deskA),var(--deskB)); display:flex; justify-content:center; }
/* 面板宽高固定 */
.panel { background:var(--panel); border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow); overflow:hidden; width:760px; height:614px;
  display:flex; flex-direction:column; position:relative; }

.tbar { display:flex; align-items:center; gap:12px; height:50px; padding:0 18px;
  border-bottom:1px solid var(--line); flex:none; }
.title { font-size:15px; font-weight:650; white-space:nowrap; }
.tabs { display:flex; gap:4px; }
.tab { font:inherit; font-size:12.5px; font-weight:650; line-height:1.4;
  padding:4px 13px; margin:0; border-radius:999px; cursor:pointer;
  border:1px solid transparent; background:none; color:var(--ink-3); }
.tab:hover:not(:disabled) { color:var(--ink); }
.tab.on { background:var(--field); color:var(--ink); border-color:var(--line); }
.tab:disabled { color:var(--ink-3); opacity:.45; cursor:not-allowed; }
.tbar .sp { flex:1; }
.tbar .cnt { font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums; }

.content { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:16px 18px; }
.scroll { scrollbar-width:thin; scrollbar-color:color-mix(in srgb,var(--ink) 20%,transparent) transparent; }
.scroll::-webkit-scrollbar { width:11px; }
.scroll::-webkit-scrollbar-track { background:transparent; }
.scroll::-webkit-scrollbar-thumb { background:color-mix(in srgb,var(--ink) 18%,transparent);
  border:3px solid transparent; background-clip:content-box; border-radius:999px; }
.scroll::-webkit-scrollbar-thumb:hover { background:color-mix(in srgb,var(--ink) 34%,transparent);
  background-clip:content-box; }

/* ── 分组 ── */
.grp { margin-bottom:16px; }
.grp:last-child { margin-bottom:2px; }
.grp-h { display:flex; align-items:baseline; gap:9px; margin-bottom:8px; }
.grp-t { font-size:13px; font-weight:700; }
.grid { display:grid; grid-template-columns:repeat(10,1fr); gap:7px; }

.cell { position:relative; width:100%; aspect-ratio:1; border-radius:9px; border:0;
  padding:0; margin:0; cursor:pointer; background:var(--field); }
.cell img { position:absolute; inset:6%; width:88%; height:88%; object-fit:contain; }
.cell .q { position:absolute; right:3px; bottom:1px; font-size:11px; font-weight:700;
  color:var(--ink); font-variant-numeric:tabular-nums;
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff; }
:root[data-theme="dark"] .cell .q { text-shadow:0 0 3px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.9); }
@media (prefers-color-scheme: dark) { :root:not([data-theme]) .cell .q {
  text-shadow:0 0 3px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.9); } }
/* 未获得的展示品：底色不透露稀有度，图标压成剪影 */
.cell.locked { background:var(--field); cursor:help; }
.cell.locked img { filter:brightness(0) saturate(0); opacity:.17; }
:root[data-theme="dark"] .cell.locked img { filter:brightness(0) invert(1); opacity:.2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme]) .cell.locked img {
  filter:brightness(0) invert(1); opacity:.2; } }
.cell:hover:not(.locked) { outline:2px solid var(--accent); outline-offset:-2px; }
.cell.locked:hover { outline:2px solid var(--line); outline-offset:-2px; }

.empty-note { font-size:12.5px; color:var(--ink-3); padding:10px 2px 4px; }

/* ── 地点图鉴 ── */
.mapblk { margin-bottom:18px; }
.mapblk:last-child { margin-bottom:2px; }
.map-h { display:flex; align-items:baseline; gap:8px; margin-bottom:3px; }
.map-n { font-size:14px; font-weight:700; }
.map-no { font-size:11.5px; color:var(--ink-3); }
.map-p { margin-left:auto; font-size:11.5px; color:var(--ink-3);
  font-variant-numeric:tabular-nums; }
.map-d { font-size:12px; color:var(--ink-2); margin-bottom:9px; }
.map-lock { font-size:12.5px; color:var(--ink-3); background:var(--field);
  border:1px solid var(--line); border-radius:10px; padding:14px 16px; }

.node { border:1px solid var(--line); border-radius:10px; padding:9px 13px;
  margin-bottom:7px; display:flex; flex-direction:column; gap:5px; }
.node.unk { background:var(--field); }
.nd-h { display:flex; align-items:center; gap:8px; }
.nd-dot { width:9px; height:9px; border-radius:50%; flex:none; background:var(--ink-3); }
.nd-dot.goal { border-radius:2px; transform:rotate(45deg); background:var(--accent); }
.nd-dot.start { background:none; border:2.5px solid var(--ink-2); }
.nd-dot.exit { background:none; border:2px dashed var(--ok); }
.nd-n { font-size:13.5px; font-weight:650; }
.node.unk .nd-n { color:var(--ink-3); font-weight:600; }
.nd-tags { margin-left:auto; display:flex; gap:5px; }
.nd-tag { font-size:10.5px; font-weight:650; padding:1px 7px; border-radius:999px;
  background:var(--field); color:var(--ink-3); white-space:nowrap; }
.nd-tag.ev { color:var(--accent); background:color-mix(in srgb,var(--accent) 12%,transparent); }
.nd-tag.ex { color:var(--ok); background:color-mix(in srgb,var(--ok) 12%,transparent); }
.nd-tag.done { color:var(--ok); background:color-mix(in srgb,var(--ok) 12%,transparent); }
.nd-row { font-size:12px; color:var(--ink-2); display:flex; align-items:center;
  gap:7px; flex-wrap:wrap; }
.nd-row b { color:var(--ink); font-weight:650; font-variant-numeric:tabular-nums; }
.mixbar { display:flex; height:7px; border-radius:4px; overflow:hidden; width:150px;
  flex:none; background:var(--field); }
.mixbar i { display:block; height:100%; }
.nd-first { display:inline-flex; align-items:center; gap:5px; }
.nd-first .ic { position:relative; width:20px; height:20px; border-radius:5px; }
.nd-first .ic img { position:absolute; inset:1px; width:calc(100% - 2px); height:calc(100% - 2px); }
.nd-edge { font-size:12px; color:var(--ink-3); }
.nd-edge b { color:var(--ink-2); font-weight:600; }
.nd-edge .req { color:var(--warn); }

/* ── 宠物图鉴：竖版卡片，图在上、信息在下，一行三张 ── */
.petgrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
.petcard { display:flex; flex-direction:column; text-align:left;
  border:1px solid var(--line); border-radius:12px; background:var(--panel);
  overflow:hidden; }
.petcard.unk { background:var(--field); }
/* 图片占满卡片宽度，尽量给大——立绘是 1:1，用 aspect-ratio 撑出方形区域 */
.pc-img { width:100%; aspect-ratio:1; background:var(--field); position:relative; }
.pc-img img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
.petcard.unk .pc-img img { filter:brightness(0) saturate(0); opacity:.17; }
:root[data-theme="dark"] .petcard.unk .pc-img img { filter:brightness(0) invert(1); opacity:.2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme]) .petcard.unk .pc-img img {
  filter:brightness(0) invert(1); opacity:.2; } }
.pc-rows { display:flex; flex-direction:column; gap:5px; padding:10px 12px 12px;
  font-size:12px; }
.pc-name { font-size:14.5px; font-weight:650; }
.petcard.unk .pc-name { color:var(--ink-3); font-weight:600; }
.pc-row { color:var(--ink-2); font-variant-numeric:tabular-nums; white-space:nowrap; }
.pc-row b { color:var(--ink); font-weight:600; }
/* 特质行始终占位，否则有特质的卡片会比没特质的高一截 */
.pc-innate { font-size:11.5px; color:var(--accent); min-height:17px; }
.pc-innate.none { visibility:hidden; }

/* ── 未开放的分类 ── */
.soon { height:100%; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:8px; color:var(--ink-3); }
.soon .st { font-size:14px; font-weight:650; color:var(--ink-2); }
.soon .sd { font-size:12.5px; max-width:44ch; text-align:center; line-height:1.7; }

.foot { flex:none; height:44px; padding:0 18px; display:flex; align-items:center;
  border-top:1px solid var(--line); font-size:12.5px; color:var(--ink-3); }

/* 单例 tooltip：格子在滚动容器里，absolute 会被裁 */
#tip { position:fixed; z-index:99; pointer-events:none; opacity:0;
  background:var(--panel); border:1px solid var(--line); border-radius:9px;
  box-shadow:var(--shadow); padding:9px 13px; max-width:290px; }
#tip.on { opacity:1; }
#tip .tn { font-size:13.5px; font-weight:650; display:block; }
#tip .tr { font-size:12px; font-weight:650; display:block; margin-top:1px; }
#tip .td { font-size:12px; font-style:italic; color:var(--desc); display:block; margin-top:4px; }
#tip .tm { font-size:12px; color:var(--ink-2); display:block; margin-top:5px;
  font-variant-numeric:tabular-nums; }
#tip .tm b { color:var(--ink); font-weight:650; }
#tip .coin { width:13px; height:13px; vertical-align:-2px; margin-right:2px; }
</style>

<div class="wrap">
<header>
  <h1>咕咕嘎嘎 · 图鉴面板原型</h1>
  <p class="tagline">从气泡菜单【图鉴 · 书】进入</p>
</header>

<p class="lede">
  物品图鉴读引擎的 <code>itemAcquisitionCounts</code>——那是<b>永久累计获得件数</b>，
  出售、消耗、丢弃、溃败都不扣减，所以图鉴一旦点亮就不会再变灰。
  <b>收藏品</b>（<code>collectible</code>）整组铺开，没拿到的显示剪影、名称稀有度描述一律打码；
  其余物品<b>只列已获得的</b>，按稀有度分组。
  <b>宠物</b>用和出发选人一样的卡片列出每位伙伴的初始数值；没结识的显示剪影。
  下面这排控件是<b>调试用</b>的，不属于玩家界面。
</p>

<div class="bar">
  <span class="barnote">收集进度：</span>
  <button class="btn" data-mock="none">全未获得</button>
  <button class="btn on" data-mock="early">早期</button>
  <button class="btn" data-mock="mid">中期</button>
  <button class="btn" data-mock="all">全收集</button>
  <button class="btn" id="bTheme">深色</button>
</div>

<div class="stage-outer">
  <div class="panel">
    <div class="tbar">
      <span class="title">图鉴</span>
      <span class="tabs">
        <button class="tab on" data-tab="item">物品</button>

        <button class="tab" data-tab="place" hidden>地点</button>
        <button class="tab" data-tab="pet">宠物</button>
      </span>
      <span class="sp"></span>
      <span class="cnt" id="cnt"></span>
    </div>
    <div class="content scroll" id="body"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>
</div>

<div id="tip"><span class="tn"></span><span class="tr"></span><span class="td"></span><span class="tm"></span></div>

  if(kind !== "none"){ S.pets = ["gugugaga"]; }
  if(kind === "mid") S.petTags = { gugugaga:["tag-lucky"] };
  if(kind === "all") S.petTags = { gugugaga:Object.keys(TAGS) };
  if(kind !== "none"){ S.maps = ["map-1"]; S.nodes = ["m1-start","m1-point-1"]; }
  if(kind === "mid"){
    S.maps = ["map-1","map-2"];
    S.nodes = ["m1-start","m1-point-1","m1-point-2","m1-goal-1","m2-start","m2-point-1"];
    S.extracted = ["map-1:m1-goal-1"];
  }
  if(kind === "all"){
    S.maps = Object.keys(MAPS);
    S.nodes = Object.values(MAPS).flatMap(m => Object.keys(m.nodes));
    S.extracted = ["map-1:m1-goal-1","map-2:m2-goal-1"];
  }
  if(kind === "none") return;
  const put = (id,n) => { S.counts[id] = n; };
  if(kind === "all"){ Object.keys(IT).forEach(id => put(id, 1 + (id.length*7)%40)); return; }
  // 早期：常见的拿了一批，展示品一件没有；中期：多拿一些，展示品拿到两件
  const pool = RORDER.slice().reverse();      // 从普通往上
  const take = kind === "early" ? [14,6,2,0,0,0] : [26,16,12,5,2,1];
  pool.forEach((r,i) => {
    NORMAL_IDS.filter(id => IT[id].rarity === r).slice(0, take[i])
      .forEach((id,k) => put(id, 1 + (k*3)%18));
  });
  if(kind === "mid") COLLECT_IDS.slice(0,2).forEach(id => put(id,1));
}

const owned = id => (S.counts[id] ?? 0) > 0;
const el = id => document.getElementById(id);

/* ── 格子 ── */
function cellHTML(id){
  const t = IT[id], has = owned(id);
  if(!has) return `<button class="cell locked" data-id="${id}" aria-label="未获得">`
    + `<img src="${ICON[id]}" alt=""></button>`;
  return `<button class="cell" data-id="${id}" style="background:${FILL[t.rarity]}">`
    + `<img src="${ICON[id]}" alt="${t.name}">`
    + `<span class="q">${S.counts[id]}</span></button>`;
}

/* ── tooltip：未获得的展示品全部打码 ── */
function showTip(elm, id){
  const t = IT[id], has = owned(id), box = el("tip");
  const q = box.querySelector(".tn"), r = box.querySelector(".tr");
  const d = box.querySelector(".td"), m = box.querySelector(".tm");
  if(!has){
    // 只留标题的问号；稀有度和描述整行收起，不要三行问号堆在一起
    q.textContent = "？？？";
    r.hidden = true;
    d.hidden = true;
    m.innerHTML = "尚未获得";
  } else {
    q.textContent = t.name;
    r.hidden = false;
    r.textContent = RNAME[t.rarity]; r.style.color = RTEXT[t.rarity];
    d.textContent = t.description || ""; d.hidden = !t.description;
    const tags = (t.tags||[]).map(x => TAG_CN[x] || x).join(" · ");
    m.innerHTML = `累计获得 <b>${S.counts[id]}</b> 件`
      + `　<img class="coin" src="${COIN}" alt="">${t.value}`
      + `　${t.weight} 负重` + (tags ? `<br>${tags}` : "");
  }
  box.classList.add("on");
  const rc = elm.getBoundingClientRect(), b = box.getBoundingClientRect();
  let x = rc.left, y = rc.bottom + 6;
  if(y + b.height > window.innerHeight - 6) y = rc.top - b.height - 6;
  if(x + b.width > window.innerWidth - 6) x = rc.right - b.width;
  box.style.left = Math.max(6, x) + "px";
  box.style.top = Math.max(6, y) + "px";
}
const hideTip = () => el("tip").classList.remove("on");

/* ── 地点 ── */
const MAPS = PACK.maps;
const RKEY = ["common","uncommon","rare","epic","legendary","mythic"];
const nodeSeen = id => S.nodes.includes(id);
const extractedAt = (mid,nid) => S.extracted.includes(`${mid}:${nid}`);

// 两种掉落模式在打包时已折算成「每档期望件数」，这里只负责画成比例条
function lootLine(l){
  const tot = RKEY.reduce((t,r) => t + l.exp[r], 0);
  if(tot <= 0) return "";
  const bar = RKEY.filter(r => l.exp[r] > 0).map(r =>
    `<i style="width:${l.exp[r]/tot*100}%;background:${FILL[r]}"></i>`).join("");
  const detail = RKEY.filter(r => l.exp[r] > 0)
    .map(r => `${RNAME[r]} ${l.exp[r]}`).join("　");
  const cnt = l.min === l.max ? `${l.min} 件` : `${l.min}~${l.max} 件`;
  return `<div class="nd-row">掉落 <b>${cnt}</b>`
    + `<span class="mixbar">${bar}</span>`
    + `<span style="color:var(--ink-3)">${detail}</span>`
    + (l.tags.length ? `<span style="color:var(--ink-3)">限 ${
        l.tags.map(t => TAG_CN[t] || t).join(" / ")}</span>` : "") + `</div>`;
}

function nodeHTML(m, id){
  const n = m.nodes[id];
  if(!nodeSeen(id)) return `<div class="node unk"><div class="nd-h">
    <span class="nd-dot"></span><span class="nd-n">？？？</span></div></div>`;
  const kind = id === m.start ? "start" : n.terminal ? "goal" : n.extractable ? "exit" : "";
  const tags = [];
  if(id === m.start) tags.push(`<span class="nd-tag">起点</span>`);
  if(n.terminal) tags.push(`<span class="nd-tag ex">终点 · 可撤离</span>`);
  else if(n.extractable) tags.push(`<span class="nd-tag ex">可撤离</span>`);
  if(n.hasEvent) tags.push(`<span class="nd-tag ev">有事件</span>`);
  if(extractedAt(m.id, id)) tags.push(`<span class="nd-tag done">撤离过</span>`);
  return `<div class="node">
    <div class="nd-h"><span class="nd-dot ${kind}"></span>
      <span class="nd-n">${n.name}</span>
      <span class="nd-tags">${tags.join("")}</span></div>
    ${n.loot ? lootLine(n.loot) : ""}
    ${n.first ? `<div class="nd-row">首次撤离奖励
      ${Object.entries(n.first).map(([iid,q]) => IT[iid]
        ? `<span class="nd-first"><span class="ic" style="background:${FILL[IT[iid].rarity]}">`
          + `<img src="${ICON[iid]}" alt=""></span>${IT[iid].name}${q>1?` ×${q}`:""}</span>`
        : iid).join("")}</div>` : ""}
    ${n.edges.map(e => `<div class="nd-edge">→ <b>${e.label}</b>　${e.min} 分`
      + (e.req && e.req.secondary
          ? `　<span class="req">需要${SEC_CN[e.req.secondary.stat] || e.req.secondary.stat} ≥ ${e.req.secondary.value}</span>`
          : "")
      + (e.hidden ? `　<span class="req">隐藏路线</span>` : "") + `</div>`).join("")}
  </div>`;
}

/* ── 宠物 ── */
const PETS = PACK.pets, TAGS = PACK.tags, PET_ART = PACK.petArt;
const PRI_CN = { fitness:"体能", perception:"感知", technique:"技巧" };

/* ── 视图 ── */
const V = {
  item(){
    const got = NORMAL_IDS.filter(owned);
    let html = "";
    // 收藏品：整组铺开，没拿到的也占位
    html += `<div class="grp"><div class="grp-h">`
      + `<span class="grp-t">收藏品</span></div>`
      + `<div class="grid">${COLLECT_IDS.map(cellHTML).join("")}</div></div>`;
    // 其余：只列已获得的，按稀有度分组
    for(const r of RORDER){
      const ids = got.filter(id => IT[id].rarity === r);
      if(!ids.length) continue;
      html += `<div class="grp"><div class="grp-h">`
        + `<span class="grp-t" style="color:${RTEXT[r]}">${RNAME[r]}</span></div>`
        + `<div class="grid">${ids.map(cellHTML).join("")}</div></div>`;
    }
    if(!got.length) html += `<div class="empty-note">还没有登记任何物品，出去探险带点东西回来吧。</div>`;
    return html;
  },
  place(){
    return Object.values(MAPS).map(m => {
      const ids = Object.keys(m.nodes);
      const seen = ids.filter(nodeSeen);
      if(!S.maps.includes(m.id)) return `<div class="mapblk">
        <div class="map-h"><span class="map-n">？？？</span>
          <span class="map-no">地图 ${m.number}</span></div>
        <div class="map-lock">尚未解锁</div></div>`;
      return `<div class="mapblk">
        <div class="map-h"><span class="map-n">${m.name}</span>
          <span class="map-no">地图 ${m.number}</span>
          <span class="map-p">已探索 ${seen.length} / ${ids.length}</span></div>
        <div class="map-d">${m.desc}</div>
        ${ids.map(id => nodeHTML(m, id)).join("")}</div>`;
    }).join("");
  },
  pet(){
    // 图鉴给的是模板的初始数值，不是玩家那只的当前状态——后者是状态面板的事
    const card = (id) => {
      const p = PETS[id];
      if(!S.pets.includes(id)) return `<div class="petcard unk">
        <span class="pc-img"><img src="${PET_ART[id] || ""}" alt=""></span>
        <span class="pc-rows"><span class="pc-name">？？？</span>
          <span class="pc-row">&nbsp;</span><span class="pc-row">&nbsp;</span>
          <span class="pc-innate none">—</span></span></div>`;
      const pri = Object.entries(p.baseStats)
        .map(([k,v]) => `${PRI_CN[k]} <b>${v}</b>`).join("　");
      const sec = Object.entries(p.secondaryStats)
        .map(([k,v]) => `${SEC_CN[k]} <b>${v}</b>`).join("　");
      const innate = p.innateTagId
        ? `初始特质 ${TAGS[p.innateTagId]?.name || p.innateTagId}` : "";
      return `<div class="petcard">
        <span class="pc-img"><img src="${PET_ART[id] || ""}" alt="${p.name}"></span>
        <span class="pc-rows">
          <span class="pc-name">${p.name}</span>
          <span class="pc-row">${pri}</span>
          <span class="pc-row">${sec}</span>
          <span class="pc-innate${innate ? "" : " none"}">${innate || "—"}</span>
        </span></div>`;
    };
    return `<div class="petgrid">${Object.keys(PETS).map(card).join("")}</div>`;
  },
};

const FOOT = {
  item: () => {
    const gotCollect = COLLECT_IDS.filter(owned).length;
    return `收藏品 ${gotCollect} / ${COLLECT_IDS.length}　·　鼠标悬停查看详情`;
  },
  place: () => {
    const seen = Object.values(MAPS).filter(m => S.maps.includes(m.id))
      .flatMap(m => Object.keys(m.nodes)).filter(nodeSeen).length;
    const total = Object.values(MAPS).reduce((t,m) => t + Object.keys(m.nodes).length, 0);
    return `已探索 ${seen} / ${total} 处地点　·　没去过的只显示 ？？？`;
  },
  pet: () => `已结识 ${S.pets.length} / ${Object.keys(PETS).length} 位伙伴　·　卡片显示的是初始数值`,
};

function render(){
  hideTip();
  el("body").innerHTML = V[S.tab]();
  el("foot").textContent = FOOT[S.tab]();
  const total = Object.keys(IT).length, got = Object.keys(IT).filter(owned).length;
  el("cnt").textContent = S.tab === "item" ? `已登记 ${got} / ${total}`
    : S.tab === "place" ? `已解锁 ${S.maps.length} / ${Object.keys(MAPS).length} 张地图`
    : S.tab === "pet" ? `已结识 ${S.pets.length} / ${Object.keys(PETS).length}` : "";
  el("body").querySelectorAll(".cell").forEach(c => {
    c.addEventListener("mouseenter", () => showTip(c, c.dataset.id));
    c.addEventListener("mouseleave", hideTip);
  });
}

function bind(){
  document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => {
    if(b.disabled) return;
    S.tab = b.dataset.tab;
    document.querySelectorAll("[data-tab]").forEach(x => x.classList.toggle("on", x === b));
    render();
  }));
  document.querySelectorAll("[data-mock]").forEach(b => b.addEventListener("click", () => {
    mock(b.dataset.mock);
    document.querySelectorAll("[data-mock]").forEach(x => x.classList.toggle("on", x === b));
    render();
  }));
  el("bTheme").addEventListener("click", () => {
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
    el("bTheme").textContent = dark ? "深色" : "浅色";
    render();
  });
}

mock("early");
bind();
render();
</script>
