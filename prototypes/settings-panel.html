<title>咕咕嘎嘎 · 设置面板原型</title>
<style>
:root {
  --ground:#edeef2; --panel:#ffffff; --ink:#191c22; --ink-2:#5f6573; --ink-3:#8990a0;
  --line:#dee0e8; --accent:#c98f10; --warn:#c2452a; --ok:#3f8f6a; --field:#f4f5f8;
  --deskA:#dfe4f0; --deskB:#eef0f6;
  --shadow:0 1px 2px rgba(25,28,34,.06), 0 12px 32px -16px rgba(25,28,34,.32);
}
@media (prefers-color-scheme: dark) { :root {
  --ground:#131519; --panel:#1a1d24; --ink:#e9ebf1; --ink-2:#949bab; --ink-3:#7b8393;
  --line:#282c35; --accent:#f0b638; --warn:#e8735a; --ok:#63b892; --field:#22262f;
  --deskA:#20242e; --deskB:#171a21;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 14px 38px -18px rgba(0,0,0,.85); } }
:root[data-theme="dark"] {
  --ground:#131519; --panel:#1a1d24; --ink:#e9ebf1; --ink-2:#949bab; --ink-3:#7b8393;
  --line:#282c35; --accent:#f0b638; --warn:#e8735a; --ok:#63b892; --field:#22262f;
  --deskA:#20242e; --deskB:#171a21;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 14px 38px -18px rgba(0,0,0,.85); }
:root[data-theme="light"] {
  --ground:#edeef2; --panel:#ffffff; --ink:#191c22; --ink-2:#5f6573; --ink-3:#8990a0;
  --line:#dee0e8; --accent:#c98f10; --warn:#c2452a; --ok:#3f8f6a; --field:#f4f5f8;
  --deskA:#dfe4f0; --deskB:#eef0f6;
  --shadow:0 1px 2px rgba(25,28,34,.06), 0 12px 32px -16px rgba(25,28,34,.32); }

* { box-sizing:border-box; }
body { margin:0; background:var(--ground); color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  line-height:1.6; -webkit-font-smoothing:antialiased; }
.wrap { max-width:1120px; margin:0 auto; padding:40px 24px 72px; }
header { display:flex; flex-wrap:wrap; align-items:baseline; gap:12px 16px; }
h1 { font-size:24px; font-weight:650; margin:0; }
.tagline { color:var(--ink-2); font-size:14px; margin:0; }
.lede { color:var(--ink-2); font-size:15px; max-width:74ch; margin:14px 0 20px; }
.lede b { color:var(--ink); font-weight:600; }
.lede code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13.5px;
  background:var(--field); padding:1px 6px; border-radius:5px; color:var(--ink); }

.bar { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin:0 0 14px; }
.btn { font:inherit; font-size:12.5px; line-height:1.4; color:var(--ink); background:var(--panel);
  border:1px solid var(--line); border-radius:8px; padding:5px 10px; margin:0; cursor:pointer; }
.btn:hover { border-color:var(--accent); color:var(--accent); }

.stage-outer { border:1px solid var(--line); border-radius:14px; padding:30px;
  background:linear-gradient(140deg,var(--deskA),var(--deskB)); display:flex; justify-content:center; }
/* 面板宽高固定：拖滑块、切开关、弹确认都不许改变它 */
.panel { background:var(--panel); border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow); overflow:hidden; width:760px; height:614px;
  display:flex; flex-direction:column; position:relative; }

.tbar { display:flex; align-items:center; gap:12px; height:50px; padding:0 18px;
  border-bottom:1px solid var(--line); flex:none; }
.title { font-size:15px; font-weight:650; }
.tbar .ver { margin-left:auto; font-size:11.5px; color:var(--ink-3);
  font-variant-numeric:tabular-nums; }

.content { flex:1; min-height:0; overflow-y:auto; padding:16px 18px 18px; }
.scroll { scrollbar-width:thin; scrollbar-color:color-mix(in srgb,var(--ink) 20%,transparent) transparent; }
.scroll::-webkit-scrollbar { width:11px; }
.scroll::-webkit-scrollbar-track { background:transparent; }
.scroll::-webkit-scrollbar-thumb { background:color-mix(in srgb,var(--ink) 18%,transparent);
  border:3px solid transparent; background-clip:content-box; border-radius:999px; }

.sec { margin-bottom:18px; }
.sec:last-child { margin-bottom:2px; }
.sec-h { font-size:12.5px; font-weight:700; color:var(--ink-2); margin-bottom:9px; }

.row { display:flex; align-items:center; gap:14px; min-height:44px;
  padding:7px 0; border-bottom:1px solid var(--line); }
.row:last-child { border-bottom:0; }
.row .k { font-size:13.5px; flex:none; width:96px; }
.row .d { font-size:11.5px; color:var(--ink-3); flex:1; }
.row .c { margin-left:auto; display:flex; align-items:center; gap:10px; flex:none; }

/* 滑块 */
.slider { -webkit-appearance:none; appearance:none; width:190px; height:4px; margin:0;
  border-radius:999px; background:var(--line); cursor:pointer; }
.slider::-webkit-slider-thumb { -webkit-appearance:none; width:15px; height:15px;
  border-radius:50%; background:var(--accent); cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.25); }
.slider::-moz-range-thumb { width:15px; height:15px; border:0; border-radius:50%;
  background:var(--accent); cursor:pointer; }
.sv { font-size:13px; font-weight:650; font-variant-numeric:tabular-nums;
  min-width:52px; text-align:right; }

/* 开关 */
.sw { position:relative; width:40px; height:22px; border-radius:999px; border:0; padding:0;
  margin:0; background:var(--line); cursor:pointer; transition:background .16s; }
.sw::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px;
  border-radius:50%; background:#fff; transition:transform .16s;
  box-shadow:0 1px 3px rgba(0,0,0,.28); }
.sw[aria-pressed="true"] { background:var(--accent); }
.sw[aria-pressed="true"]::after { transform:translateX(18px); }

/* 桌宠大小的实时预览：气泡按真实像素画，能直接感受大小 */
.preview { margin-top:10px; border:1px solid var(--line); border-radius:11px;
  background:linear-gradient(140deg,var(--deskA),var(--deskB));
  padding:14px 16px; display:flex; align-items:flex-end; gap:18px; height:150px; }
.pv-pet { flex:none; position:relative; height:100%; display:flex; align-items:flex-end; }
.pv-pet img { height:100%; width:auto; object-fit:contain; display:block; }
.pv-right { flex:1; min-width:0; display:flex; flex-direction:column; gap:7px;
  align-items:flex-start; padding-bottom:4px; }
.pv-body { position:relative; height:13px; }
.pv-body::before, .pv-body::after { content:""; position:absolute; top:0; bottom:0;
  width:1px; background:var(--ink-3); opacity:.5; }
.pv-body::before { left:0; } .pv-body::after { right:0; }
.pv-body i { position:absolute; top:50%; left:0; right:0; height:1px;
  background:var(--ink-3); opacity:.5; }
.pv-body span { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  background:var(--deskB); padding:0 6px; font-size:10.5px; color:var(--ink-3);
  font-style:normal; white-space:nowrap; }
.pv-menu { display:flex; }
.pv-bub { border-radius:50%; background:var(--panel); flex:none;
  box-shadow:0 1px 4px rgba(0,0,0,.16); display:grid; place-items:center; }
.pv-bub img { width:92%; height:92%; object-fit:contain; }
.pv-note { font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.pv-note.warn { color:var(--warn); font-weight:650; }

/* 存档 */
.save-sum { display:flex; gap:20px; font-size:12px; color:var(--ink-2);
  background:var(--field); border:1px solid var(--line); border-radius:10px;
  padding:10px 14px; margin-bottom:10px; }
.save-sum b { color:var(--ink); font-weight:650; font-variant-numeric:tabular-nums; }
.save-act { display:flex; gap:8px; }
.sbtn { font:inherit; font-size:12.5px; padding:7px 14px; margin:0; border-radius:8px;
  border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
.sbtn:hover { border-color:var(--accent); color:var(--accent); }
.sbtn.danger { margin-left:auto; color:var(--warn);
  border-color:color-mix(in srgb,var(--warn) 40%,transparent); }
.sbtn.danger:hover { background:var(--warn); border-color:var(--warn); color:#fff; }

.about { font-size:12.5px; color:var(--ink-2); line-height:1.9; }
.about b { color:var(--ink); font-weight:650; }

.modal { position:absolute; inset:0; background:rgba(20,16,10,.45); display:grid;
  place-items:center; z-index:60; border-radius:14px; }
.modal-box { width:320px; background:var(--panel); border:1px solid var(--line);
  border-radius:12px; padding:16px 18px; box-shadow:0 12px 32px -12px rgba(0,0,0,.4); }
.modal-t { font-size:14.5px; font-weight:650; margin-bottom:5px; }
.modal-d { font-size:12.5px; color:var(--ink-2); line-height:1.6; margin-bottom:14px; }
.modal-a { display:flex; gap:8px; justify-content:flex-end; }
.modal-a button { font:inherit; font-size:12.5px; padding:6px 14px; border-radius:8px;
  cursor:pointer; border:1px solid var(--line); background:var(--panel); color:var(--ink-2); }
.modal-a button:hover { border-color:var(--accent); color:var(--accent); }
.modal-a button.pri { background:var(--warn); border-color:var(--warn); color:#fff; font-weight:600; }
.modal-a button.pri:hover { color:#fff; filter:brightness(1.06); }

.toast { position:absolute; left:50%; bottom:22px; transform:translateX(-50%); z-index:70;
  background:var(--ink); color:var(--panel); font-size:12.5px; padding:7px 15px;
  border-radius:999px; box-shadow:0 8px 22px -8px rgba(0,0,0,.5); white-space:nowrap; }

.sizeout { margin-top:10px; text-align:center; font-size:12px; color:var(--ink-3);
  font-family:ui-monospace,Menlo,monospace; }
</style>

<div class="wrap">
<header>
  <h1>咕咕嘎嘎 · 设置面板原型</h1>
  <p class="tagline">从气泡菜单【设置 · 齿轮】进入</p>
</header>

<p class="lede">
  设置项都是<b>客户端配置</b>，引擎里除了 <code>createInitialState</code>（清档重来）没有对应字段。
  其中<b>桌宠大小</b>不是一个普通滑块——气泡菜单的铁律是
  <code>菜单宽 = 本体宽 = 画布 × 0.47</code>，改画布会连带改变五颗气泡的直径，
  所以这一项必须<b>实时预览</b>，并在气泡小到不可用时拦住。
</p>

<div class="bar">
  <button class="btn" id="bReset">重置演示</button>
  <button class="btn" id="bTheme">深色</button>
</div>

<div class="stage-outer">
  <div class="panel" id="panel">
    <div class="tbar">
      <span class="title">设置</span>
      <span class="ver">v0.1.0-demo</span>
    </div>
    <div class="content scroll" id="body"></div>
  </div>
</div>
<div class="sizeout" id="sizeout"></div>
</div>

const ICON = PACK.icons, PET = PACK.pet;

/* 气泡菜单的尺寸铁律，和 pet-menu.html 里的 CSS 变量一致：
   本体宽 = 画布 × 0.47（站立躯干实测 451/960），
   气泡直径 = (本体宽 − 4 × 间距) / 5，五颗一行、总宽仍等于本体宽。 */
const BODY_RATIO = 0.47, GAP = 4, BUBS = 5;
const bodyW = c => c * BODY_RATIO;
const bubSize = c => (bodyW(c) - (BUBS - 1) * GAP) / BUBS;
// 文档里记的可用下限：低于这个尺寸图标就看不清了
const BUB_MIN = 22;
const CANVAS_MIN = 260, CANVAS_MAX = 420;

const S = {
  canvas: 300, onTop: true, autoStart: false, volume: 60,
  confirm: null, toast: "",
};
const el = id => document.getElementById(id);

const swHTML = (key, on) =>
  `<button class="sw" data-sw="${key}" aria-pressed="${on}" aria-label="${on ? "已开启" : "已关闭"}"></button>`;

function previewHTML(){
  const c = S.canvas, bw = bodyW(c), bs = bubSize(c);
  const tooSmall = bs < BUB_MIN;
  const menuW = bs * BUBS + GAP * (BUBS - 1);
  return `<div class="preview">
    <span class="pv-pet" style="width:${Math.round(c * 0.42)}px">
      <img src="${PET}" alt=""></span>
    <span class="pv-right">
      <span class="pv-body" style="width:${menuW}px"><i></i><span>本体 ${bw.toFixed(0)}px</span></span>
      <span class="pv-menu" style="gap:${GAP}px">${
        ["status","storage","flag","codex","gear"].map(k =>
          `<span class="pv-bub" style="width:${bs}px;height:${bs}px"><img src="${ICON[k]}" alt=""></span>`
        ).join("")}</span>
      <span class="pv-note${tooSmall ? " warn" : ""}">画布 ${c}px　本体 ${bw.toFixed(0)}px　气泡 ${
        bs.toFixed(1)}px${tooSmall ? `　· 低于可用下限 ${BUB_MIN}px，图标会看不清` : ""}</span>
    </span>
  </div>`;
}

function view(){
  return `
  <div class="sec">
    <div class="sec-h">桌宠</div>
    <div class="row">
      <span class="k">桌宠大小</span>
      <span class="d">菜单宽度由本体宽反算，改这里会连带改变五颗气泡的直径</span>
      <span class="c">
        <input class="slider" type="range" id="canvas" min="${CANVAS_MIN}" max="${CANVAS_MAX}"
          step="10" value="${S.canvas}">
        <span class="sv">${S.canvas}px</span></span>
    </div>
    ${previewHTML()}
    <div class="row" style="margin-top:6px">
      <span class="k">窗口置顶</span>
      <span class="d">始终显示在其他窗口之上</span>
      <span class="c">${swHTML("onTop", S.onTop)}</span>
    </div>
    <div class="row">
      <span class="k">开机自启</span>
      <span class="d">登录系统后自动把咕嘎放到桌面上</span>
      <span class="c">${swHTML("autoStart", S.autoStart)}</span>
    </div>
    <div class="row">
      <span class="k">音量</span>
      <span class="d">交互音效与提示音</span>
      <span class="c">
        <input class="slider" type="range" id="volume" min="0" max="100" step="5" value="${S.volume}">
        <span class="sv">${S.volume}</span></span>
    </div>
  </div>

  <div class="sec">
    <div class="sec-h">存档</div>
    <div class="save-sum">
      <span>已玩 <b>3 小时 24 分</b></span>
      <span>完成任务 <b>2</b></span>
      <span>图鉴 <b>22 / 93</b></span>
      <span>仓库 <b>18 / 40</b> 格</span>
    </div>
    <div class="save-act">
      <button class="sbtn" data-a="export">导出存档</button>
      <button class="sbtn" data-a="import">导入存档</button>
      <button class="sbtn danger" data-a="wipe">清档重来</button>
    </div>
  </div>

  <div class="sec">
    <div class="sec-h">关于</div>
    <div class="about">
      <b>咕咕嘎嘎</b>　v0.1.0-demo<br>
      一只企鹅在桌面上打工、探险、往仓库里搬东西。
    </div>
  </div>
  ${confirmHTML()}
  ${S.toast ? `<div class="toast">${S.toast}</div>` : ""}`;
}

function confirmHTML(){
  if(S.confirm !== "wipe") return "";
  return `<div class="modal"><div class="modal-box">
    <div class="modal-t">清档重来？</div>
    <div class="modal-d">当前存档会被整个清空：宠物等级、仓库物品、图鉴进度、
      已完成的任务全部归零，且<b>无法找回</b>。建议先导出一份再清。</div>
    <div class="modal-a">
      <button data-a="cancel">取消</button>
      <button class="pri" data-a="wipe-yes">确认清档</button></div>
  </div></div>`;
}

let base = null;
function render(){
  el("body").innerHTML = view();
  const p = el("body");

  const cv = el("canvas");
  if(cv) cv.addEventListener("input", () => { S.canvas = +cv.value; render(); });
  const vol = el("volume");
  if(vol) vol.addEventListener("input", () => { S.volume = +vol.value; render(); });

  p.querySelectorAll("[data-sw]").forEach(b => b.addEventListener("click", () => {
    S[b.dataset.sw] = !S[b.dataset.sw]; render();
  }));
  p.querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", () => act(b.dataset.a)));

  if(S.toast){ clearTimeout(render.__t); render.__t = setTimeout(() => { S.toast = ""; render(); }, 2200); }
  checkSize();
}

function act(a){
  if(a === "export") S.toast = "已导出 gugugaga-save.json";
  else if(a === "import") S.toast = "选择存档文件…（demo 里不真的读盘）";
  else if(a === "wipe") S.confirm = "wipe";
  else if(a === "cancel") S.confirm = null;
  else if(a === "wipe-yes"){ S.confirm = null; S.toast = "存档已清空，重新开始"; }
  render();
}

// 面板尺寸铁律的自检：拖滑块、切开关、弹确认都不该改变它
function checkSize(){
  const r = el("panel").getBoundingClientRect();
  const cur = `${Math.round(r.width)} × ${Math.round(r.height)}`;
  base ??= cur;
  el("sizeout").innerHTML = `面板尺寸 ${cur}　`
    + (cur === base ? `<span style="color:var(--ok)">恒定 ✓</span>`
      : `<span style="color:var(--warn)">变了！首帧是 ${base}</span>`);
}

el("bReset").addEventListener("click", () => {
  Object.assign(S, { canvas:300, onTop:true, autoStart:false, volume:60, confirm:null, toast:"" });
  render();
});
el("bTheme").addEventListener("click", () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  el("bTheme").textContent = dark ? "深色" : "浅色";
});

render();
</script>
